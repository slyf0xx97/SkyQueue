<!-- @dsCard group="Agents" height=120 subtitle="Glyph tile and name; square, circle, hexagon" -->
<div class="hs hs-stack">
  <div class="hs-row" style="gap:32px">
    <span class="hs-agent hs-agent--tower"><span class="hs-agent__glyph" aria-hidden="true">T</span><span class="hs-agent__name">Tower</span></span>
    <span class="hs-agent hs-agent--pilot"><span class="hs-agent__glyph" aria-hidden="true">P</span><span class="hs-agent__name">Pilot</span></span>
    <span class="hs-agent hs-agent--ground"><span class="hs-agent__glyph" aria-hidden="true">G</span><span class="hs-agent__name">Ground</span></span>
  </div>
  <div class="hs-row" style="gap:8px">
    <span class="hs-chip hs-chip--tower">PROPOSE</span>
    <span class="hs-chip hs-chip--pilot">COUNTER</span>
    <span class="hs-chip hs-chip--ground">✓ ACCEPT</span>
    <span class="hs-chip hs-chip--pilot">✕ REJECT</span>
  </div>
</div>
